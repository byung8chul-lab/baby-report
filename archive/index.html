<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지난 리포트</title><style>:root{--bg:#f6f4f0;--card:#ffffff;--ink:#2b2620;--sub:#8a8177;--accent:#e8734a;
--chip:#fdeee7;--line:#ece7e0;--badge:#2f8f5b;--badge-bg:#e7f5ec}
@media(prefers-color-scheme:dark){:root{--bg:#191614;--card:#242019;--ink:#f0eae2;
--sub:#a99e91;--accent:#f08a62;--chip:#3a2c23;--line:#332d26;--badge:#7dd3a3;--badge-bg:#1f3529}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;
-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
header{padding:28px 4px 20px}
header h1{font-size:1.5rem;letter-spacing:-.02em}
header .date{color:var(--sub);font-size:.9rem;margin-top:6px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 4px 24px}
nav a{font-size:.8rem;text-decoration:none;color:var(--accent);background:var(--chip);
padding:6px 12px;border-radius:20px;white-space:nowrap}
section{margin-bottom:28px}
section h2{font-size:1.08rem;padding:0 4px 4px;letter-spacing:-.01em}
section .desc{color:var(--sub);font-size:.8rem;padding:0 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:block;padding:14px 16px;text-decoration:none;color:inherit;
border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item:active{background:var(--chip)}
.item .t{font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.item .m{margin-top:5px;font-size:.78rem;color:var(--sub);display:flex;gap:6px;
align-items:center;flex-wrap:wrap}
.badge{color:var(--badge);background:var(--badge-bg);font-size:.7rem;font-weight:700;
padding:1px 7px;border-radius:10px}
.empty{padding:18px 16px;color:var(--sub);font-size:.88rem}
footer{margin-top:36px;text-align:center;color:var(--sub);font-size:.75rem}
footer a{color:var(--sub)}</style></head>
<body><div class="wrap"><header><h1>📚 지난 리포트</h1></header>
<div class="card"><a class="item" href="index.html"><div class="t">index</div></a><a class="item" href="2026-07-15.html"><div class="t">2026-07-15</div></a></div>
<footer><a href="../">오늘 리포트로</a></footer></div></body></html>
