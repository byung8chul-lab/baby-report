<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지난 리포트</title><style>:root{--red:#e0304b;--red-dark:#c9243e;--yellow:#ffb200;--ink:#1c1c1e;--sub:#8e8e93;
--line:#ececec;--bg:#ffffff;--soft:#f8f8f8;--eyebrow:#4f46e5}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;
-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:1080px;
margin:0 auto;padding:18px 20px}
.topbar .brand{font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.topbar .brand em{color:var(--red);font-style:normal}
.topbar .day{font-size:.82rem;color:var(--sub)}
.hero{position:relative;padding-bottom:24px}
.hero .band{position:absolute;left:0;right:0;top:40px;height:150px;background:var(--yellow)}
.hero-card{position:relative;max-width:880px;margin:0 auto;background:#fff;
border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.10);padding:30px 32px}
.hero-wrap{padding:0 16px}
.eyebrow{color:var(--eyebrow);font-size:.85rem;font-weight:600;margin-bottom:6px}
.hero-card h1{font-size:1.7rem;letter-spacing:-.03em;display:flex;align-items:center;
gap:10px;flex-wrap:wrap}
.pill-badge{font-size:.72rem;font-weight:700;color:var(--red);border:1.5px solid var(--red);
border-radius:20px;padding:2px 10px;white-space:nowrap}
.hero-meta{margin-top:12px;font-size:.85rem;color:var(--sub)}
.hero-meta b{color:var(--ink)}
.hero-split{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.hero-left{flex:1 1 320px}
.hero-right{flex:0 0 240px;border-left:1px solid var(--line);padding-left:28px;
display:flex;flex-direction:column;gap:12px;justify-content:center}
@media(max-width:640px){.hero-right{border-left:none;padding-left:0;flex:1 1 auto}}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px}
.tags span{font-size:.8rem;color:#6e6e73}
.tags span::before{content:"# ";color:var(--sub)}
.weather{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:.85rem}
.weather .grade{font-size:1.05rem;font-weight:800}
.weather .grade em{font-style:normal;color:var(--red)}
.weather .detail{margin-top:4px;color:var(--sub);font-size:.78rem}
.cta{display:block;text-align:center;background:var(--red);color:#fff;font-weight:700;
font-size:.92rem;border-radius:10px;padding:13px 18px}
.cta:active{background:var(--red-dark)}
.pills{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);
backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:26px}
.pills-in{max-width:880px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;
padding:12px 16px;scrollbar-width:none}
.pills-in::-webkit-scrollbar{display:none}
.pills a{flex:0 0 auto;font-size:.82rem;font-weight:600;color:#555;
border:1px solid var(--line);border-radius:24px;padding:8px 16px;background:#fff}
.pills a:active{border-color:var(--red);color:var(--red)}
main{max-width:880px;margin:0 auto;padding:8px 16px 60px}
section{margin-top:46px}
section h2{text-align:center;font-size:1.35rem;letter-spacing:-.03em}
section .desc{text-align:center;color:var(--sub);font-size:.85rem;margin:6px 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.04)}
.item{display:block;padding:16px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item:hover{background:var(--soft)}
.item .t{font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.item .m{margin-top:6px;font-size:.78rem;color:var(--sub);display:flex;gap:8px;
align-items:center;flex-wrap:wrap}
.region{font-size:.68rem;font-weight:700;color:var(--red);border:1.2px solid var(--red);
border-radius:14px;padding:1px 8px}
.empty{padding:20px 18px;color:var(--sub);font-size:.88rem;text-align:center}
footer{border-top:1px solid var(--line);margin-top:56px;padding:28px 16px 44px;
text-align:center;color:var(--sub);font-size:.78rem}
footer a{color:var(--red);font-weight:600}
.pills a b{margin-left:5px;color:var(--red);font-weight:800}
.news-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.badge{font-size:.66rem;font-weight:700;border-radius:12px;padding:2px 8px;line-height:1.5}
.badge-stage{background:#f1f1f4;color:#555}
.badge-topic{background:#eef2ff;color:#4f46e5}
.badge-official{background:#fff0f2;color:var(--red);border:1px solid var(--red)}
.badge-alert{background:#fde8e8;color:#b91c1c;border:1px solid #f3b4b4}
.badge-ad{background:#f2f2f2;color:#9a9a9f}
.event-group-label{padding:14px 18px 4px;font-size:.8rem;font-weight:700;color:var(--sub);
border-bottom:1px solid var(--line)}
details.more{border-top:1px solid var(--line)}
details.more>summary{cursor:pointer;list-style:none;padding:13px 18px;font-size:.85rem;
font-weight:700;color:var(--red);text-align:center}
details.more>summary::-webkit-details-marker{display:none}</style></head>
